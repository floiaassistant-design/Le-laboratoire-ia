name: laboratory-checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests
        run: |
          python -m unittest discover -s tests -v
          python -c "import unittest; n=unittest.TestLoader().discover('tests').countTestCases(); print('Discovered tests:', n); assert n >= 16, 'Unit tests not discovered'"
      - name: Reproduce EXP-003
        run: python run_hybrid.py
      - name: EXP-004A external corpus smoke test (offline)
        run: python -m lab.quixbugs_screen
