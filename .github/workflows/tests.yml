name: laboratory-checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests (must discover >= 199)
        run: |
          python -m unittest discover -s tests -v
          python -c "import unittest; n=unittest.TestLoader().discover('tests').countTestCases(); print('Discovered tests:', n); assert n >= 199"
      - name: EXP-009B candidate metadata structural preflight (no upstream execution)
        run: python -m lab.exp009b_candidates
      - name: EXP-007A non-executing static test inventory
        run: python -m lab.real_test_inventory --root . --scan-dir tests --output results/exp007a-inventory.json --require-tests
      - name: Archive EXP-007A inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp007a-inventory-raw
          path: results/exp007a-inventory.json
          if-no-files-found: error
          retention-days: 30
      - name: EXP-007B compare static versus unittest discovered identities
        run: python -m lab.real_test_collector --root . --scan-dir tests --output results/exp007b-identity-report.json --allow-imports --verify-exact
      - name: Archive EXP-007B identity audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp007b-identity-raw
          path: results/exp007b-identity-report.json
          if-no-files-found: error
          retention-days: 30
      - name: Reproduce EXP-003
        run: python run_hybrid.py
      - name: EXP-004A external benchmark smoke test
        run: python -m lab.quixbugs_screen
      - name: EXP-004B isolated four-program pilot
        run: python -m lab.quixbugs_pilot
      - name: Archive raw EXP-004B observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp004b-pilot-raw
          path: results/exp004b-pilot.json
          if-no-files-found: warn
          retention-days: 30
      - name: EXP-004B 16-program external-policy comparison
        run: python -m lab.quixbugs_external
      - name: Archive external policy outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp004b-external-raw
          path: results/exp004b-external.json
          if-no-files-found: warn
          retention-days: 30
      - name: EXP-005 fixed-probe order ablation
        run: python -m lab.quixbugs_order
      - name: Archive EXP-005 raw observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp005-order-raw
          path: results/exp005.json
          if-no-files-found: error
          retention-days: 30
      - name: EXP-006A input-only diversity pilot
        run: python -m lab.quixbugs_diversity
      - name: Archive EXP-006A raw observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp006a-diversity-raw
          path: results/exp006a.json
          if-no-files-found: error
          retention-days: 30
      - name: EXP-006B validate new-corpus manifest locally
        run: python -m lab.external_corpus_preflight --offline
      - name: EXP-006B verify upstream source metadata (no code execution)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m lab.external_corpus_preflight --online
      - name: Archive EXP-006B qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp006b-corpus-preflight
          path: results/exp006b-preflight.json
          if-no-files-found: error
          retention-days: 30

  historical-reproduction:
    name: Pinned historical Unicode bug (non-scoring smoke test)
    needs: offline-tests
    # Ubuntu 26.04 lacks the Python 3.8 toolcache; pin the legacy-compatible runner.
    runs-on: ubuntu-22.04
    timeout-minutes: 7
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Reproduce one real defect with ASCII locale
        run: python -m lab.pysnooper_unicode_smoke --online
      - name: Archive historical source reproduction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp006b-realbug-smoke
          path: results/exp006b-realbug-smoke.json
          if-no-files-found: warn
          retention-days: 30

  independent-reproduction:
    name: Second real project tqdm (known-bug non-scoring smoke)
    needs: offline-tests
    runs-on: ubuntu-22.04
    timeout-minutes: 7
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Validate pinned real-bug manifest
        run: python -m lab.tqdm_start_smoke --offline
      - name: Reproduce tqdm tenumerate start-offset defect in three fresh runs
        run: |
          for replicate in 1 2 3; do
            python -m lab.tqdm_start_smoke --online --output "results/exp006c-tqdm-smoke-${replicate}.json"
          done
      - name: Archive real-project reproduction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp006c-tqdm-realbug
          path: results/exp006c-tqdm-smoke-*.json
          if-no-files-found: warn
          retention-days: 30

  realbug-priority-pilot:
    name: Two new real projects (non-blind exploratory scoring)
    needs: offline-tests
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Compare policies on two pinned historical real-bug projects
        run: python -m lab.real_bug_priority --output results/exp008a-real-priority.json
      - name: Archive complete pilot observations (including blocked runs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp008a-real-bug-priority-raw
          path: results/exp008a-real-priority.json
          if-no-files-found: error
          retention-days: 30

  exp008b-three-projects:
    name: EXP-008B ${{ matrix.project }} (predeclared real bugs)
    needs: offline-tests
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        project: [youtube-dl, tornado, cookiecutter]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Install pinned historical Cookiecutter test dependencies
        if: matrix.project == 'cookiecutter'
        continue-on-error: true
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check \
            pytest==7.4.4 pytest-mock==3.8.2 freezegun==1.2.2 \
            binaryornot==0.4.4 Jinja2==2.11.3 click==7.1.2 \
            poyo==0.5.0 jinja2-time==0.2.0 \
            python-slugify==4.0.1 requests==2.25.1 \
            MarkupSafe==1.1.1 PyYAML==5.4.1
      - name: Evaluate exactly the predeclared cases and report every blocker
        env:
          PROJECT: ${{ matrix.project }}
        run: python -m lab.real_bug_batch --project "$PROJECT"
      - name: EXP-009A audit existing status transitions without rescoring
        env:
          PROJECT: ${{ matrix.project }}
        run: python -m lab.oracle_audit --input "results/exp008b-${PROJECT}-raw.json" --output "results/exp009a-${PROJECT}-audit.json"
      - name: Archive raw results and oracle audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp008b-${{ matrix.project }}-raw
          path: |
            results/exp008b-${{ matrix.project }}-raw.json
            results/exp009a-${{ matrix.project }}-audit.json
          if-no-files-found: warn
          retention-days: 30
