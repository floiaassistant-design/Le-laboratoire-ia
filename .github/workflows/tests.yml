name: laboratory-checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests (must discover >= 24)
        run: |
          python -m unittest discover -s tests -v
          python -c "import unittest; n=unittest.TestLoader().discover('tests').countTestCases(); print('Discovered tests:', n); assert n >= 24"
      - name: Reproduce EXP-003
        run: python run_hybrid.py
      - name: EXP-004A external benchmark smoke test
        run: python -m lab.quixbugs_screen
      - name: EXP-004B isolated four-program pilot
        run: python -m lab.quixbugs_pilot
      - name: Archive raw EXP-004B observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp004b-pilot-raw
          path: results/exp004b-pilot.json
          if-no-files-found: warn
          retention-days: 30
