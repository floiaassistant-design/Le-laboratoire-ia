name: laboratory-checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests (must discover >= 48)
        run: |
          python -m unittest discover -s tests -v
          python -c "import unittest; n=unittest.TestLoader().discover('tests').countTestCases(); print('Discovered tests:', n); assert n >= 48"
      - name: Reproduce EXP-003
        run: python run_hybrid.py
      - name: EXP-004A external benchmark smoke test
        run: python -m lab.quixbugs_screen
      - name: EXP-004B isolated four-program pilot
        run: python -m lab.quixbugs_pilot
      - name: Archive raw EXP-004B observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp004b-pilot-raw
          path: results/exp004b-pilot.json
          if-no-files-found: warn
          retention-days: 30
      - name: EXP-004B 16-program external-policy comparison
        run: python -m lab.quixbugs_external
      - name: Archive external policy outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp004b-external-raw
          path: results/exp004b-external.json
          if-no-files-found: warn
          retention-days: 30
      - name: EXP-005 fixed-probe order ablation
        run: python -m lab.quixbugs_order
      - name: Archive EXP-005 raw observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp005-order-raw
          path: results/exp005.json
          if-no-files-found: error
          retention-days: 30
      - name: EXP-006A input-only diversity pilot
        run: python -m lab.quixbugs_diversity
      - name: Archive EXP-006A raw observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp006a-diversity-raw
          path: results/exp006a.json
          if-no-files-found: error
          retention-days: 30
